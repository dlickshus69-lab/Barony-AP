# Optional. You normally connect from the Barony Archipelago window that opens with the game,
# and you don't need this file at all.
#
# To use it, rename it to archipelago.cfg (next to barony.exe).
#  - Without the tracker window (BaronyAPTracker.exe missing), the game connects with these at
#    the main menu. server is the address from the room page, slot is your name from your YAML.
#  - The tracker window fills its boxes from it the first time.
server=archipelago.gg:38281
slot=YourName
password=
#
# Barony's Halloween and Christmas themes are off. Uncomment to keep them:
# holiday_theme=1
