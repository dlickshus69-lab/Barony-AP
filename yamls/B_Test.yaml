name: B Test
description: Barony Archipelago test settings.
game: Barony
Barony:
  progression_balancing: normal
  accessibility: full

  # Goal & Checks
  goal: devil
  floor_check_interval: 1
  level_checks: 15
  enemy_sanity: marked_enemies
  enemy_sanity_checks: 10
  enemy_sanity_kills_per_check: 3
  enemy_sanity_per_floor: 2
  bestiary_checks: early
  archipelago_pickups: 20
  pickups_per_floor: 2
  shop_checks: 5
  boss_checks: true
  special_area_checks: false

  # Skills
  skill_checks: off
  skill_check_max_rank: expert
  lock_class: true

  # Dungeon
  floor_keys: true
  key_compass_time: 30
  floor_size: normal
  floor_shuffle: full
  layout_seed: locked
  enemy_randomizer: off
  enemy_randomizer_secret_areas: false
  enemy_pool: near_depth
  enemy_seed: locked
  music_shuffle: off
  music_seed: locked
  music_mods: mixed
  enemy_level_scaling: off
  boss_level_scaling: off
  minotaur_time: 100
  difficulty_scaling: true
  difficulty: normal

  # Lives & Checkpoints
  lives: 5
  extra_lives_in_pool: 2
  checkpoint_interval: every_5_floors

  # Death Link
  death_link: true
  death_link_mode: restart_floor
  death_penalty: none
  death_items: floor_start
  floor_restart: new_layout
  boss_death: keep_damage

  # Traps
  trap_chance: 50
  minotaur_trap_weight: 10
  ambush_trap_weight: 10
  polymorph_trap_weight: 10
  fumble_trap_weight: 10
  blindness_trap_weight: 10
  teleport_trap_weight: 10
  hunger_trap_weight: 10
  darkness_trap_weight: 10
  curse_trap_weight: 10
  polymorph_trap_duration: 30
  blindness_trap_duration: 15

  # Filler
  xp_boost_weight: 30
  gold_pouch_weight: 25
  healing_potion_weight: 20
  food_ration_weight: 15
  random_item_weight: 10

  # Players
  players: 1

  local_items: []
  non_local_items: []
  start_inventory: {}
  start_hints: []
  start_location_hints: []
  exclude_locations: []
  priority_locations: []
