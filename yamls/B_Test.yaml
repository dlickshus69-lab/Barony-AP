name: B Test
description: Barony Archipelago test settings.
game: Barony
Barony:
  progression_balancing: normal
  accessibility: full

  # Goal & Checks
  goal: devil
  custom_dungeon_length: false
  dungeon_floors: 10
  boss_rush_bosses:
  - Devil
  - Herx
  - Twin Liches
  boss_rush_order: game_order
  boss_rush_rest_town: true
  floor_check_interval: 1
  level_checks: 15
  enemy_sanity: marked_enemies
  enemy_sanity_checks: 10
  enemy_sanity_kills_per_check: 3
  enemy_sanity_per_floor: 2
  bestiary_checks: early
  archipelago_pickups: 20
  pickups_per_floor: 2
  shop_checks: 5
  boss_checks: true
  special_area_checks: false

  # Dungeon
  floor_keys: true
  floor_key_requirement: key_only
  compass: off
  compass_mode: ping_and_recharge
  compass_ping_time: 15
  compass_recharge: 90
  key_compass_time: 30
  minotaur_time: 100
  floor_shuffle: full
  layout_seed: locked
  floor_size:
  - Normal
  extra_monsters: 0
  enemy_randomizer: off
  enemy_seed: locked
  enemy_randomizer_secret_areas: false
  enemy_pool: near_depth
  enemy_level_scaling: off
  boss_level_scaling: off
  difficulty_scaling: true
  difficulty: normal
  randomize_loot: same_kind

  # Class, Skills & Spells
  skill_checks: off
  skill_check_max_rank: expert
  lock_class: true
  spell_sanity: false
  spell_upgrades: 0
  spell_sanity_dlc_spells: false
  spellbook_checks: false

  # Lives & Checkpoints
  lives: 5
  extra_lives_in_pool: 2
  checkpoint_interval: every_5_floors
  death_penalty: none
  death_items: floor_start
  floor_restart: new_layout
  boss_death: keep_damage
  death_markers: true
  death_marker_gold: 20

  # Filler
  xp_boost_weight: 30
  gold_pouch_weight: 25
  healing_potion_weight: 20
  food_ration_weight: 15
  random_item_weight: 10

  # Traps
  trap_chance: 50
  minotaur_trap_weight: 10
  ambush_trap_weight: 10
  polymorph_trap_weight: 10
  fumble_trap_weight: 10
  blindness_trap_weight: 10
  teleport_trap_weight: 10
  hunger_trap_weight: 10
  darkness_trap_weight: 10
  curse_trap_weight: 10
  polymorph_trap_duration: 30
  blindness_trap_duration: 15

  # Death Link
  death_link: true
  death_link_mode: restart_floor

  # Extras
  progressive_lantern: false
  lantern_darkness: 2
  bounty_enemies: false
  bounty_chance: 50
  bounty_checks: 5
  merchant_caravan: false
  caravan_chance: 25
  caravan_checks: 5
  caravan_hints: true

  # Challenges
  champion_floors: 0
  champion_locks_stairs: true
  champion_checks: 5

  # Music
  music_shuffle: off
  music_seed: locked
  music_mods: mixed

  # Quality of Life
  floor_key_on_tracker_map: false

  # Players
  players: 1

  local_items: []
  non_local_items: []
  start_inventory: {}
  start_hints: []
  start_location_hints: []
  exclude_locations: []
  priority_locations: []
